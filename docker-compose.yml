version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: tapapply-postgres
    environment:
      POSTGRES_DB: tapapply
      POSTGRES_USER: tapapply
      POSTGRES_PASSWORD: tapapply_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tapapply"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tapapply-net

  redis:
    image: redis:7-alpine
    container_name: tapapply-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tapapply-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tapapply-backend
    environment:
      DATABASE_URL: postgresql://tapapply:tapapply_pass@postgres:5432/tapapply
      REDIS_URL: redis://redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PYTHONUNBUFFERED: "1"
      DEBUG: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/src:/app/src
      - backend_data:/app/data
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    networks:
      - tapapply-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tapapply-frontend
    environment:
      BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - tapapply-net

volumes:
  postgres_data:
  redis_data:
  backend_data:
  backend_logs:

networks:
  tapapply-net:
    driver: bridge
